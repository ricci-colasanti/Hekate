# ============================================================================
# config_test.yaml - Hekate smoke test
# ============================================================================
#
# Exercises:
#   - data_dir resolution
#   - datafile loading into params.datafile
#   - hekate_lookup.index(...) for nested keyed lookups
#   - deterministic RNG via math.random (backed by HekateRNG)
#   - the standard aging model
#   - per-iteration output snapshots (output_N.csv)
#
# Directory layout:
#   config_test.yaml
#   data/
#     population.csv             (header: id, sex, alive, income, region, age)
#     rules_increment_income.csv (header: sex, alive, value, sd)
#
# PATH CONVENTIONS
# ----------------
#   population_file  → resolved against the process CWD.
#                      Include the "data/" prefix in the path.
#   datafile         → resolved against data_dir.
#                      Do NOT include the "data/" prefix.
#
# ============================================================================

simulation:
  iterations: 5
  population_file: "data/population.csv"
  output_file: "n_output.csv"
  random_seed: 42
  verbose: true
  id_column: id
  area_column: region
  streaming_mode: false
  data_dir: "data"
  output_every_iteration: true

models:
  # --------------------------------------------------------------------------
  # MODEL 1: AGING
  #
  # Increments 'age' by 1 for every living person. The CSV has an 'age'
  # column, so no allow-columns directive is needed.
  # --------------------------------------------------------------------------
  - name: aging_model
    type: lua_model
    priority: 1
    enabled: true
    description: "Age living people by 1 year each iteration"
    parameters:
      script: |
        function transition(population, params)
          for _, person in ipairs(population) do
            if person.alive then
              local age = tonumber(person.age) or 18
              person.age = age + 1
            end
          end
          return population
        end

  # --------------------------------------------------------------------------
  # MODEL 2: INCREMENT INCOME
  # --------------------------------------------------------------------------
  - name: increment_income_by_sex_alive
    type: lua_model
    priority: 2
    enabled: true
    description: "Add uniform noise around 'value' to income, grouped by sex|alive, from rules_increment_income.csv"
    datafile: "rules_increment_income.csv"
    parameters:
      script: |
        function transition(population, params)
          local by_key = hekate_lookup.index(params.datafile, "sex", "alive")

          for _, person in ipairs(population) do
            local rule = by_key[person.sex] and by_key[person.sex][person.alive]
            if rule then
              local offset = (2 * math.random() - 1) * rule.sd
              local income = person.income or 0
              person.income = math.max(0, income + rule.value + offset)
            end
          end

          return population
        end